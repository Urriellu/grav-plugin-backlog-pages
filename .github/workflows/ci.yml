name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Grav's own releases can break us without anything changing here, and a
  # plugin that quietly stopped working on the current Grav is worse than one
  # that never claimed to. Monday morning is soon enough to hear about it.
  schedule:
    - cron: '0 6 * * 1'

# Nothing here needs to write to the repository; the reporting job below asks
# for the little more that it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor the arrow functions impose and the README claims.
        # The end-to-end job below runs on versions people actually deploy;
        # this one only proves the syntax floor is where we say it is.
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

  metadata:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Every YAML file parses
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path('.').rglob('*.y*ml')):
              if 'vendor' in p.parts:
                  continue
              try:
                  yaml.safe_load(p.read_text())
              except Exception as e:
                  print(f'{p}: {e}', file=sys.stderr)
                  bad = 1
          sys.exit(bad)
          PY

      - name: Blueprint is releasable and agrees with the changelog
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          bp = yaml.safe_load(open('blueprints.yaml'))
          missing = [k for k in
                     ('name', 'slug', 'type', 'version', 'description', 'author', 'license')
                     if not bp.get(k)]
          if missing:
              sys.exit(f'blueprints.yaml is missing GPM-required fields: {missing}')

          compat = bp.get('compatibility', {}).get('grav')
          if not compat:
              sys.exit('blueprints.yaml is missing a compatibility.grav list; without it '
                       'Grav 2.0 infers a single version from the grav dependency')

          # Every Grav line we claim compatibility with has to be a line the
          # end-to-end job actually boots, or the claim is decoration.
          workflow = open('.github/workflows/ci.yml').read()
          for line in compat:
              if f"grav: '{line}'" not in workflow:
                  sys.exit(f'blueprints.yaml claims Grav {line} but no e2e matrix entry tests it')

          version = str(bp['version'])
          lines = open('CHANGELOG.md').readlines()
          if lines[0].strip() != f'# {version}':
              sys.exit(f'CHANGELOG.md starts with {lines[0].strip()!r}, expected "# {version}"')
          if not re.fullmatch(r'## \d{4}-\d{2}-\d{2}', lines[1].strip()):
              sys.exit(f'CHANGELOG.md line 2 is {lines[1].strip()!r}, expected "## YYYY-MM-DD"')

          for f in (f"{bp['slug']}.php", f"{bp['slug']}.yaml"):
              try:
                  open(f).close()
              except OSError:
                  sys.exit(f'{f} is missing; Grav derives its name from the slug')
          print(f"OK: {bp['slug']} {version}, compatible with Grav {compat}")
          PY

  e2e:
    name: Grav ${{ matrix.grav }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Grav 1.7 runs Twig 1.44 and ships Quark; Grav 2.0 runs Twig 3 and
          # ships Quark2. Both lines are claimed in blueprints.yaml, so both
          # lines get booted.
          # 7.4 is the floor the arrow functions impose; Grav 1.7 itself goes
          # lower, but this is the oldest PHP the plugin can run on.
          - { grav: '1.7', php: '7.4' }
          - { grav: '1.7', php: '8.1' }
          - { grav: '1.7', php: '8.3' }
          - { grav: '2.0', php: '8.3' }
          - { grav: '2.0', php: '8.4' }
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, curl, dom, mbstring, intl, openssl
          coverage: none

      - name: Resolve the newest Grav ${{ matrix.grav }} release
        id: grav
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/getgrav/grav.git \
                  '${{ matrix.grav }}.*' \
                | sed 's|.*refs/tags/||' | sort -V | tail -1)
          [ -n "$tag" ] || { echo "no tag matched ${{ matrix.grav }}.*"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Newest Grav ${{ matrix.grav }} release is $tag"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ steps.grav.outputs.tag }}

      - name: Install Grav ${{ steps.grav.outputs.tag }}
        run: |
          git clone -q --depth 1 --branch '${{ steps.grav.outputs.tag }}' \
            https://github.com/getgrav/grav.git grav
          cd grav
          composer install --no-dev --no-interaction --no-progress --quiet
          # Pulls in the default theme (Quark on 1.7, Quark2 on 2.0) plus the
          # error and problems plugins, straight from GitHub.
          php bin/grav install

      - name: End-to-end
        run: python3 plugin/tests/e2e/run.py --grav grav

      - name: Server log on failure
        if: failure()
        run: tail -n 200 grav/e2e-server.log || true

  browser:
    # The filtering ships as plain <script> tags, so only a browser can say
    # whether it works. One Grav line is enough here: the script is identical on
    # both, and the markup it reads is already asserted on both by the e2e job.
    name: Browser (Grav 2.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, curl, dom, mbstring, intl, openssl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugin/tests/browser/package-lock.json

      - name: Resolve the newest Grav 2.0 release
        id: grav
        run: |
          tag=$(git ls-remote --tags --refs https://github.com/getgrav/grav.git '2.0.*' \
                | sed 's|.*refs/tags/||' | sort -V | tail -1)
          [ -n "$tag" ] || { echo "no tag matched 2.0.*"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Grav ${{ steps.grav.outputs.tag }}
        run: |
          git clone -q --depth 1 --branch '${{ steps.grav.outputs.tag }}' \
            https://github.com/getgrav/grav.git grav
          cd grav
          composer install --no-dev --no-interaction --no-progress --quiet
          php bin/grav install

      - name: Install Playwright
        working-directory: plugin/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: plugin/tests/browser
        env:
          GRAV_ROOT: ${{ github.workspace }}/grav
        run: npx playwright test

      - name: Traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: plugin/tests/browser/test-results/
          retention-days: 7

  report:
    # Everything above lands in the Checks tab as eleven separate entries, which
    # is eleven things to read before you know whether a pull request is safe to
    # merge. This job reduces them to one: a single pass/fail check to require in
    # branch protection, and a comment on the pull request itself listing what
    # ran and what each job concluded.
    name: CI
    needs: [lint, metadata, e2e, browser]
    # Without always() this job would be skipped exactly when it is most needed,
    # which is when one of the jobs it reports on has failed.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # to read the sibling jobs' results
      pull-requests: write   # to leave the results comment
    steps:
      - name: Collect the results of every job in this run
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # needs.* collapses a whole matrix into one verdict, so ask the API
          # instead: it reports each leg of the e2e matrix separately, with a
          # link straight to that leg's log.
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | {name, conclusion, html_url}' > jobs.jsonl

          python3 - <<'PY'
          import json, os

          MARKER = '<!-- backlog-pages-ci-results -->'
          ICON = {'success': ':white_check_mark:', 'failure': ':x:',
                  'cancelled': ':heavy_minus_sign:', 'skipped': ':fast_forward:',
                  'timed_out': ':hourglass:'}

          with open('jobs.jsonl') as fh:
              jobs = [json.loads(line) for line in fh if line.strip()]
          # This job is still running, so it has no verdict to report about
          # itself. Its name is the `name:` above.
          jobs = [j for j in jobs if j['name'] != 'CI']

          failed = [j for j in jobs if j['conclusion'] != 'success']
          passed = len(jobs) - len(failed)
          heading = ':x: CI failed' if failed else ':white_check_mark: CI passed'

          out = [MARKER, '', f'### {heading} &mdash; {passed}/{len(jobs)} jobs green',
                 '', '| | Job | Result |', '|:--|:--|:--|']
          for j in jobs:
              result = j['conclusion'] or 'running'
              out.append(f"| {ICON.get(j['conclusion'], ':grey_question:')} "
                         f"| [{j['name']}]({j['html_url']}) | {result} |")
          out += ['', f"[Full run logs]({os.environ['RUN_URL']}) "
                      f"for commit `{os.environ['SHA'][:7]}`."]
          report = '\n'.join(out) + '\n'

          with open('report.md', 'w') as fh:
              fh.write(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write(report)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'failed={len(failed)}\n')
          PY

      - name: Show the results on the pull request
        if: github.event_name == 'pull_request'
        # A pull request from a fork gets a read-only token, so the comment is a
        # nicety that cannot be allowed to turn a green run red. The check itself
        # still reports, and the step summary still has the table.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          marker='<!-- backlog-pages-ci-results -->'
          # Update the comment we left last time rather than stacking a new one
          # on every push, so the conversation stays readable.
          existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                       --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
                     | tail -1)
          jq -Rs '{body: .}' report.md > payload.json
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input payload.json --silent
            echo "Updated the existing results comment ($existing)."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" --input payload.json --silent
            echo "Posted a results comment."
          fi

      - name: Fail if any job did not pass
        env:
          FAILED: ${{ steps.report.outputs.failed }}
        run: |
          [ "$FAILED" = "0" ] \
            || { echo "::error::$FAILED job(s) did not pass; see the table above."; exit 1; }
